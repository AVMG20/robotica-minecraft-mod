name: Build

# Every push and pull request builds the jar and runs the game tests; the jar is kept as a workflow artifact.
# Pushing a tag like v0.2.0 builds that version and publishes it as a GitHub release with the jar attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the jar
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.value }} --no-daemon

      - name: Run the game tests
        run: ./gradlew runGameTestServer -Pmod_version=${{ steps.version.outputs.value }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robotica-${{ steps.version.outputs.value }}
          path: build/libs/robotica-*.jar
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/libs/robotica-*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/libs/robotica-*.jar --title "Robotica $GITHUB_REF_NAME" --generate-notes
          fi
