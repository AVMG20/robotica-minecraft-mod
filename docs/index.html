<template id="home">
<header class="hero">
  <div class="wrap">
    <div class="copy">
      <h1>ROBOTICA</h1>
      <p class="tag">Robots that do the boring stuff.<br>From your first copper to the End.</p>
      <div class="btns">
        <a class="mcbtn go" href="#install">Play it</a>
        <a class="mcbtn" href="#/guide/getting-started">Open the wiki</a>
      </div>
    </div>
    <img class="shot" src="shots/07_robots.jpg" alt="Stumpy and Sprout, two small robots, next to trees and a wheat field">
  </div>
  <div class="ground" aria-hidden="true"></div>
</header>

<section class="ages" aria-labelledby="ages-h">
  <div class="wrap">
    <h2 id="ages-h">Day one to the End</h2>
    <p class="sub">Hover or tap an item. Every tier upgrades the last one.</p>
    <div class="rows" id="rows"></div>
    <p class="sub" style="margin-top:18px"><a href="#/progression">Every step, age by age</a></p>
  </div>
</section>

<section class="wrap wikihome" id="wiki" aria-labelledby="wiki-h">
  <h2 id="wiki-h">The wiki</h2>
  <p class="lead">Short guides, every block with what it does, which upgrade cards fit, and buildable multiblock examples. Press <kbd>/</kbd> to search.</p>
  <div class="grid-cards" id="homeguides"></div>
</section>

<div class="wrap features" id="features">

  <article class="feat">
    <div class="text">
      <span class="kicker">Day one · copper only</span>
      <h2>Meet Stumpy</h2>
      <p>Wind up a spring, drop a robot near your trees and go explore.</p>
      <ul>
        <li>Stumpy chops whole trees and replants</li>
        <li>Sprout harvests and replants crops</li>
        <li>Both fill your chests, or your Refined Storage</li>
      </ul>
    </div>
    <div class="pair">
      <img class="frame" src="shots/02_blocks_close_a.jpg" alt="Robotica machines and robots placed in a field">
      <img class="frame" src="shots/gui_11_stumpy.jpg" alt="Stumpy's menu with battery and upgrade slots">
    </div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Wireless power</span>
      <h2>No cables. Just coils.</h2>
      <p>Put a Tesla Coil on a battery or generator, grab the Linker and click your machines. Chain coils to reach further.</p>
      <ul>
        <li>4 to 32 links per coil, up to 1M FE/t</li>
        <li>Click a face to pick the side power goes in</li>
        <li>Quiet when you're done, glowing when you hold the Linker</li>
      </ul>
      <div class="icons" data-icons="tesla_linker"></div>
    </div>
    <img class="frame" src="shots/11_tesla_network.jpg" alt="A Tesla Coil on an accumulator sending power to four machines with thin glowing lines">
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Power tools</span>
      <h2>1×1. 3×3. 12×12×12.</h2>
      <p>Press <kbd>V</kbd> to switch modes. Sneak for one block. A battery in your bag keeps the drill going.</p>
      <div class="icons" data-icons="tinkers_hammer,bore_drill,servo_drill,magma_drill,null_drill,chainsaw"></div>
    </div>
    <img class="frame" src="shots/10_drill_hud_outline.jpg" alt="A 3x3 mining outline on stone with the drill's mode bar">
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Drones</span>
      <h2>Your own little crew</h2>
      <ul>
        <li><b>Mining Drone</b> digs a 3×3 tunnel, lights it, and flies back if it smells lava</li>
        <li><b>Sentry Drone</b> guards your base or follows you into a fight</li>
        <li><b>Courier Drone</b> carries items from chest to chest</li>
      </ul>
    </div>
    <div class="panel big" data-icons="mining_drone,sentry_drone,courier_drone,mining_drone_mk2,sentry_drone_mk2,courier_drone_mk2"></div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Base builder</span>
      <h2>Click a grid. Get a base.</h2>
      <p>Feed the Architect Table cobble and wood. Pick plots. It builds clean 9×9 halls, joins them and adds the doors.</p>
      <p>Four styles, from clean stone to tech.</p>
    </div>
    <div class="pair">
      <img class="frame" src="shots/04_styles_halls.jpg" alt="Four buildings in the four building styles">
      <img class="frame" src="shots/gui_16_architect_table.jpg" alt="Architect Table menu with a plot grid">
    </div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Storage Terminal</span>
      <h2>A chest that grew up</h2>
      <p>81 slots, search, sorting and a crafting grid. Add expansions for up to 648 slots. Hoppers and drones can use it too.</p>
      <div class="icons" data-icons="storage_expansion_mk1"></div>
    </div>
    <img class="frame" src="shots/gui_95_storage_terminal.jpg" alt="Storage Terminal menu with a search box, sorted items and a crafting grid">
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Warp</span>
      <h2>Portals, but cooler</h2>
      <p>One projector block throws a swirling portal into the air. Link two and walk through, even across dimensions.</p>
      <p>Warp Pads and a Recall Remote get you home.</p>
      <div class="icons" data-icons="recall_remote"></div>
    </div>
    <img class="frame" src="shots/09_gate_and_pad.jpg" alt="Two portal projectors with floating swirling portals">
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">First boss</span>
      <h2>The Scrap Colossus</h2>
      <p>Find a Rusted Foundry, light a Signal Flare at the altar and dodge the slam. When it overheats, hit the glowing core.</p>
      <ul>
        <li>Drops the Servo Core you need for Age 2</li>
        <li>Summon it again whenever you want</li>
        <li>Build your own altar for a home arena</li>
      </ul>
      <div class="icons" data-icons="signal_flare"></div>
    </div>
    <div class="pair">
      <img class="frame" src="shots/12_scrap_colossus.jpg" alt="The Scrap Colossus, a rusted copper robot boss">
      <img class="frame" src="shots/13_rusted_foundry.jpg" alt="A Rusted Foundry ruin seen from above">
    </div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Exo-Frame</span>
      <h2>Suit up</h2>
      <p>Powered armor with modules: speed, night vision, water breathing, double jump, a magnet, and real flight.</p>
    </div>
    <div class="panel big" style="--cols:4" data-icons="exo_helmet_mk1,exo_chestplate_mk1,exo_leggings_mk1,exo_boots_mk1,flight_module,magnet_module,night_vision_module,jet_assist_module"></div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">Mob Replicator</span>
      <h2>Bottle a monster</h2>
      <p>Sample a mob with a vial, put it in the replicator and get its loot. No mob farm, no lag.</p>
      <div class="icons" data-icons="essence_vial_full"></div>
    </div>
    <div class="pair">
      <img class="frame" src="shots/08_replicator.jpg" alt="The Mob Replicator multiblock">
      <img class="frame" src="shots/gui_92_replicator_formed.jpg" alt="Mob Replicator menu working">
    </div>
  </article>

  <article class="feat">
    <div class="text">
      <span class="kicker">In game</span>
      <h2>The Codex shows the way</h2>
      <p>Every new player gets a Codex. It tells you your next step, and every item in it shows its recipe.</p>
      <div class="icons" data-icons="codex"></div>
    </div>
    <div class="pair">
      <img class="frame" src="shots/codex_01_start.jpg" alt="Codex page with your next steps">
      <img class="frame" src="shots/codex_03_recipe.jpg" alt="Codex recipe page">
    </div>
  </article>

</div>

<section class="install" id="install">
  <div class="wrap">
    <h2>Play it</h2>
    <p>Minecraft 1.21.1 with NeoForge. Works next to Thermal, Mekanism, Refined Storage and AE2, shows up in JEI and Jade, and runs on servers.</p>
    <div class="steps">
      <div class="step"><b>1</b><span>Install NeoForge 21.1 for Minecraft 1.21.1 from <a href="https://neoforged.net" target="_blank" rel="noopener">neoforged.net</a>.</span></div>
      <div class="step"><b>2</b><span>Drop the Robotica jar in your <code>mods</code> folder.</span></div>
      <div class="step"><b>3</b><span>Start the NeoForge profile, open your Codex and craft a Copper Gear.</span></div>
    </div>
  </div>
</section>
